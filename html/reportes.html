<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Producción</title>
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/navbar.css">
        <link rel="stylesheet" href="../css/reportes.css">
    </head>

    <body>

        <div class="reporte-container">
            <h2>Reporte de Producción</h2>

            <div class="acciones">
                <label for="codigoLote">Código</label><input type="text" id="codigoLote">
                <label for="fechaElaboracionDesde">Desde</label><input type="date" id="fechaElaboracionDesde">
                <label for="fechaElaboracionHasta">Hasta</label><input type="date" id="fechaElaboracionHasta">

                <button id="filtrar">Buscar</button>
<!--                <button id="exportarExcel">Exportar Excel</button>-->

                <div class="selector">
                    Mostrar
                    <select id="itemsPorPagina">
                        <option value="5" selected>5</option>
                        <option value="10" >10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                    registros
                </div>
            </div>

            <table id="tablaReportes">

            <thead>
                <tr>
                    <th>Lote</th>
                    <th>Producto</th>
                    <th>Marca</th>
                    <th>Elaboración</th>
                    <th>Vencimiento</th>
                    <th>Productos</th>
                    <th>Cajas</th>
                    <th>Pallets</th>
                    <th>Peso neto</th>
                </tr>
            </thead>

            <tbody id="registrosTabla"></tbody>

            </table>

            <div class="paginacion">
                <button id="anterior">Anterior</button>
                <span id="pagina"></span>
                <button id="siguiente">Siguiente</button>
            </div>
        </div>

        <script src="../js/navbar.js"></script>
        <script src="../js/reportes.js"></script>

    </body>
</html>
