<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/etiquetas.css">
</head>
<body>
    <!-- CONTENEDOR PRINCIPAL -->
  <div class="page-center etiquetas-wrapper">
    <div class="etiquetas-card">

      <div class="logo-container">
        <img src="media/logo-siscod-azul.png" alt="SISCOD Logo">
      </div>

      <h2>Gestión de Etiquetas</h2>
      <!-- FORMULARIO -->
      <div class="form-row">
        <label for="etiqueta">Etiqueta</label>
        <select id="etiqueta">
          <option value="">-- Seleccione --</option>
        </select>
      </div>

      <div class="form-row">
        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" placeholder="Ejm: Queso Cremoso">
      </div>

      <div class="form-row">
        <label for="rutaArchivo">Ruta archivo</label>
        <input type="text" id="rutaArchivo" placeholder="C:/etiquetas/etiqueta-ejemplo.txt">
      </div>

      <button id="btnGuardar">Guardar</button>

    </div>
  </div>

  <div id="overlay" onclick="toggleMenu()"></div>
  <script type="module" src="js/etiquetas.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
