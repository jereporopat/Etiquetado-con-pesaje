<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ABM de Marcas</title>
    <link rel="stylesheet" href="../css/marcas.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>

<div class="page-center form-container">
    <h2>ABM de Marcas</h2>

    <div class="form-group">
        <label for="marcaId">Marca</label>
        <select id="marcaId">
            <option value="">--Seleccione--</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nombre">Nombre de la marca</label>
        <input type="text" id="nombre" class="input-text" placeholder="Ej: Hitachi">
    </div>

    <div class="form-group checkbox-line">
        <label for="habilitada">Habilitada</label>
        <input type="checkbox" id="habilitada">
    </div>

    <button id="btnGuardar">Guardar</button>
</div>

<script type="module"  src="../js/marcas.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
